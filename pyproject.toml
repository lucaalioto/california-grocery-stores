[project]
name = "grocery-store-classification"
version = "0.1.0"
description = "A research project to classify food retail environments in California using Overture Maps data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Luca Alioto" }
]

dependencies = [
    "duckdb",
    "leafmap",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
